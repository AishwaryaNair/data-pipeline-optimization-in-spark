# Snapshot of the properties applied to every measured batch, recorded from
# the executed runs. Nothing reads this file; it is here so the configuration
# is legible without reading submit_cloud.py. The values that execute live in
# SPARK_PROPERTIES in scripts/submit_cloud.py.
#
# The first two are Dataproc properties, not spark.* ones; they are included
# because a premium tier would put Lightning Engine underneath the
# optimization being measured.
dataproc.tier=standard
spark.dataproc.engine=default

spark.sql.adaptive.enabled=false
spark.sql.autoBroadcastJoinThreshold=-1
spark.dynamicAllocation.enabled=false
spark.executor.instances=2
spark.executor.cores=4
spark.executor.memory=16g
spark.driver.cores=4
spark.driver.memory=16g
spark.sql.shuffle.partitions=200
spark.eventLog.enabled=true
spark.eventLog.compress=false
spark.ui.showConsoleProgress=false
